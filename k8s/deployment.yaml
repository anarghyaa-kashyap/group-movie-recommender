apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-recommender
  labels:
    app: movie-recommender
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: movie-recommender
  template:
    metadata:
      labels:
        app: movie-recommender
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: DOCKERHUB_USERNAME/group-movie-recommender:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/app.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      # emptyDir instead of a PersistentVolumeClaim: this is a single-replica classroom
      # demo, not a production deployment, so data does not need to survive a pod restart.
      volumes:
        - name: data
          emptyDir: {}
