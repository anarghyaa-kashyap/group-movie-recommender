name: Publish to Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/group-movie-recommender
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  k8s-smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - name: Deploy manifests to a kind cluster
        run: |
          sed -i "s#DOCKERHUB_USERNAME#${{ secrets.DOCKERHUB_USERNAME }}#" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/movie-recommender --timeout=180s
          kubectl get pods -o wide
          kubectl port-forward service/movie-recommender 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/healthz
