name: Pull IMDB dataset from Kaggle

on:
  workflow_dispatch:          # manual "Run workflow" button
  schedule:
    - cron: "0 3 1 * *"       # 1st of every month, 03:00 UTC

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Download dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: kaggle datasets download -d chenyanglim/imdb-v2 -p data --unzip --force

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in dataset."
          else
            git commit -m "Update IMDB dataset from Kaggle"
            git push
          fi